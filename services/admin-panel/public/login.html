<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logga in – Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f4f0;
      --surface:  #ffffff;
      --border:   #d8d6d0;
      --text:     #1a1a18;
      --muted:    #888780;
      --accent:   #1a1a18;
      --err-bg:   #fcebeb;
      --err-text: #a32d2d;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 360px;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: "DM Mono", monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 12px;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      letter-spacing: 0.04em;
    }

    input {
      padding: 10px 12px;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); background: #fff; }

    .btn-login {
      margin-top: 0.25rem;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: "DM Sans", sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) { opacity: 0.8; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { opacity: 0.6; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      font-size: 13px;
      color: var(--err-text);
      background: var(--err-bg);
      border-radius: 8px;
      padding: 10px 12px;
      display: none;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
<div class="wrap">
  <p class="logo">Admin Panel</p>
  <h1>Logga in</h1>

  <div class="card">
    <div class="field">
      <label for="email">E-postadress</label>
      <input id="email" type="email" autocomplete="email" placeholder="du@exempel.se" />
    </div>
    <div class="field">
      <label for="password">Lösenord</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>
    <div class="error" id="err"></div>
    <button class="btn-login" id="btn" onclick="login()">
      <div class="spinner"></div>
      <span class="btn-text">Logga in</span>
    </button>
  </div>
</div>
 
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  let supabase;

  async function initSupabase() {
    const res = await fetch('/api/config');
    const { supabaseUrl, supabaseAnonKey } = await res.json();
    supabase = createClient(supabaseUrl, supabaseAnonKey);

    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = '/';
  }

  window.login = async function () {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn');
    const err      = document.getElementById('err');

    err.classList.remove('visible');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = '/';
    } catch (e) {
      err.textContent = e.message || 'Inloggningen misslyckades.';
      err.classList.add('visible');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  };

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.login();
  });

  initSupabase();
</script>
</body>
</html>
